name: CI

on:
  # Runs against the merge result (refs/pull/N/merge), i.e. "what main would look like after merging"
  pull_request:
    branches:
      - main

# Cancel an in-progress run when a newer commit is pushed to the same PR
concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Registry connections occasionally reset (ECONNRESET). npm retries each download,
      # and the whole install is retried in case a retry budget runs out.
      - name: Install dependencies
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 10000
          npm_config_fetch_retry_maxtimeout: 60000
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "::warning::npm ci failed (attempt $attempt of 3), retrying in 15s"
            sleep 15
          done
          exit 1
      - name: Typecheck
        run: npm run typecheck
      # Fails on broken links and anchors (onBrokenLinks: 'throw')
      - name: Build website
        run: npm run build
