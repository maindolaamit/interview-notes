<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 210" font-family="'IBM Plex Sans',monospace" font-size="11" width="680" height="210">
<rect x="0" y="0" width="680" height="210" fill="#ffffff"/>
            <!-- lanes -->
            <rect x="10"  y="0" width="120" height="210" fill="#f0fdf4" rx="4"/>
            <rect x="280" y="0" width="120" height="210" fill="#f0fdf4" rx="4"/>
            <rect x="550" y="0" width="120" height="210" fill="#f0fdf4" rx="4"/>

            <!-- headers -->
            <text x="70"  y="18" text-anchor="middle" font-weight="bold" fill="#166534">Producer</text>
            <text x="340" y="18" text-anchor="middle" font-weight="bold" fill="#166534">Network</text>
            <text x="610" y="18" text-anchor="middle" font-weight="bold" fill="#166534">Broker</text>

            <!-- lifelines -->
            <line x1="70"  y1="24" x2="70"  y2="205" stroke="#86efac" stroke-width="1.5" stroke-dasharray="4,3"/>
            <line x1="340" y1="24" x2="340" y2="205" stroke="#86efac" stroke-width="1.5" stroke-dasharray="4,3"/>
            <line x1="610" y1="24" x2="610" y2="205" stroke="#86efac" stroke-width="1.5" stroke-dasharray="4,3"/>

            <!-- step 1: send batch A with PID+seq -->
            <line x1="70" y1="45" x2="330" y2="55" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arr2-blue)"/>
            <text x="190" y="44" text-anchor="middle" fill="#1d4ed8" font-weight="bold">Batch A (PID=42, seq=1)</text>

            <!-- step 2: send batch B -->
            <line x1="70" y1="65" x2="330" y2="75" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arr2-blue)"/>
            <text x="190" y="63" text-anchor="middle" fill="#1d4ed8" font-weight="bold">Batch B (PID=42, seq=2)</text>

            <!-- A gets network error -->
            <line x1="330" y1="80" x2="80" y2="90" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr2-red)"/>
            <text x="200" y="78" text-anchor="middle" fill="#dc2626">network error for A</text>

            <!-- B arrives, broker buffers because seq=2 but expects seq=1 -->
            <line x1="340" y1="78" x2="600" y2="95" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr2-orange)"/>
            <text x="480" y="84" text-anchor="middle" fill="#d97706">B arrives (seq=2)</text>
            <text x="610" y="110" text-anchor="middle" fill="#d97706" font-size="10">buffers B — waiting</text>
            <text x="610" y="122" text-anchor="middle" fill="#d97706" font-size="10">for seq=1 first</text>

            <!-- A is retried -->
            <line x1="70" y1="110" x2="330" y2="120" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr2-purple)"/>
            <text x="190" y="108" text-anchor="middle" fill="#7c3aed" font-weight="bold">Retry A (PID=42, seq=1)</text>

            <!-- A lands, then broker writes A then B in order -->
            <line x1="340" y1="125" x2="600" y2="140" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr2-green)"/>
            <text x="480" y="132" text-anchor="middle" fill="#16a34a" font-weight="bold">A written at offset 0 ✓</text>

            <line x1="610" y1="148" x2="610" y2="162" stroke="#16a34a" stroke-width="2" marker-end="url(#arr2-green)"/>
            <text x="655" y="158" fill="#16a34a" font-size="10">B written</text>
            <text x="655" y="170" fill="#16a34a" font-size="10">at offset 1 ✓</text>

            <!-- result label -->
            <text x="610" y="185" text-anchor="middle" fill="#166534" font-size="10">Partition: A, B</text>
            <text x="610" y="197" text-anchor="middle" fill="#166534" font-size="10">(sent A,B → got A,B) ✓</text>

            <defs>
              <marker id="arr2-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                <path d="M0,0 L0,6 L8,3 z" fill="#1d4ed8"/>
              </marker>
              <marker id="arr2-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
              </marker>
              <marker id="arr2-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
              </marker>
              <marker id="arr2-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                <path d="M0,0 L0,6 L8,3 z" fill="#7c3aed"/>
              </marker>
              <marker id="arr2-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
              </marker>
            </defs>
          </svg>