<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" font-family="'IBM Plex Sans',sans-serif" font-size="12" width="720" height="200">
<rect x="0" y="0" width="720" height="200" fill="#ffffff"/>
        <rect x="10" y="20" width="340" height="165" rx="10" fill="#FEF2F2" stroke="#DC2626"/>
        <text x="180" y="42" text-anchor="middle" font-weight="700" fill="#991b1b" font-family="'IBM Plex Mono',monospace">eager (stop-the-world)</text>
        <text x="180" y="68" text-anchor="middle" fill="#7f1d1d">ALL consumers revoke ALL partitions,</text>
        <text x="180" y="86" text-anchor="middle" fill="#7f1d1d">then everyone re-joins &amp; is reassigned.</text>
        <text x="180" y="118" text-anchor="middle" fill="#b91c1c" font-weight="600">→ whole group pauses during rebalance</text>
        <text x="180" y="150" text-anchor="middle" fill="#7f1d1d" font-size="11">RangeAssignor / RoundRobinAssignor</text>

        <rect x="370" y="20" width="340" height="165" rx="10" fill="#ECFDF5" stroke="#059669"/>
        <text x="540" y="42" text-anchor="middle" font-weight="700" fill="#065f46" font-family="'IBM Plex Mono',monospace">cooperative (incremental)</text>
        <text x="540" y="68" text-anchor="middle" fill="#065f46">only the partitions that must move</text>
        <text x="540" y="86" text-anchor="middle" fill="#065f46">are revoked; the rest keep processing.</text>
        <text x="540" y="118" text-anchor="middle" fill="#047857" font-weight="600">→ far less disruption; preferred default</text>
        <text x="540" y="150" text-anchor="middle" fill="#065f46" font-size="11">CooperativeStickyAssignor</text>
      </svg>