<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" font-family="'IBM Plex Sans',monospace" font-size="11" width="680" height="200">
<rect x="0" y="0" width="680" height="200" fill="#ffffff"/>
            <!-- lanes -->
            <rect x="10"  y="0" width="120" height="200" fill="#fef2f2" rx="4"/>
            <rect x="280" y="0" width="120" height="200" fill="#fef2f2" rx="4"/>
            <rect x="550" y="0" width="120" height="200" fill="#fef2f2" rx="4"/>

            <!-- headers -->
            <text x="70"  y="18" text-anchor="middle" font-weight="bold" fill="#991b1b">Producer</text>
            <text x="340" y="18" text-anchor="middle" font-weight="bold" fill="#991b1b">Network</text>
            <text x="610" y="18" text-anchor="middle" font-weight="bold" fill="#991b1b">Broker</text>

            <!-- lifelines -->
            <line x1="70"  y1="24" x2="70"  y2="195" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="4,3"/>
            <line x1="340" y1="24" x2="340" y2="195" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="4,3"/>
            <line x1="610" y1="24" x2="610" y2="195" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="4,3"/>

            <!-- step 1: send batch A -->
            <line x1="70" y1="45" x2="330" y2="55" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arr-bad)"/>
            <text x="190" y="44" text-anchor="middle" fill="#1d4ed8" font-weight="bold">Batch A (seq=1)</text>

            <!-- step 2: send batch B (in flight) -->
            <line x1="70" y1="65" x2="330" y2="75" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arr-bad)"/>
            <text x="190" y="63" text-anchor="middle" fill="#1d4ed8" font-weight="bold">Batch B (seq=2)</text>

            <!-- step 3: A gets an error -->
            <line x1="330" y1="80" x2="80" y2="90" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-err)"/>
            <text x="200" y="78" text-anchor="middle" fill="#dc2626">network error for A</text>

            <!-- step 4: B reaches broker and is written -->
            <line x1="340" y1="75" x2="600" y2="95" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-ok)"/>
            <text x="475" y="82" text-anchor="middle" fill="#16a34a">B written at offset 0</text>

            <!-- step 5: A is retried -->
            <line x1="70" y1="105" x2="330" y2="115" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-bad)"/>
            <text x="190" y="104" text-anchor="middle" fill="#d97706" font-weight="bold">Retry Batch A</text>

            <!-- step 6: A now written AFTER B -->
            <line x1="340" y1="120" x2="600" y2="135" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-err)"/>
            <text x="475" y="118" text-anchor="middle" fill="#dc2626" font-weight="bold">A written at offset 1 ⚠</text>

            <!-- result label -->
            <text x="610" y="160" text-anchor="middle" fill="#991b1b" font-size="10">Partition: B, A</text>
            <text x="610" y="174" text-anchor="middle" fill="#991b1b" font-size="10">(sent A,B → got B,A)</text>

            <!-- arrow markers -->
            <defs>
              <marker id="arr-bad" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                <path d="M0,0 L0,6 L8,3 z" fill="#1d4ed8"/>
              </marker>
              <marker id="arr-err" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
              </marker>
              <marker id="arr-ok" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
              </marker>
            </defs>
          </svg>