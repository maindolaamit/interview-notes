<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" font-family="'IBM Plex Sans',sans-serif" font-size="12" width="720" height="210">
<rect x="0" y="0" width="720" height="210" fill="#ffffff"/>
        <!-- three columns -->
        <g>
          <rect x="10" y="20" width="220" height="170" rx="10" fill="#FEF2F2" stroke="#DC2626"/>
          <text x="120" y="42" text-anchor="middle" font-weight="700" fill="#991b1b" font-family="'IBM Plex Mono',monospace">at-most-once</text>
          <text x="120" y="66" text-anchor="middle" fill="#7f1d1d">1. commit offset</text>
          <text x="120" y="86" text-anchor="middle" fill="#7f1d1d">2. process record</text>
          <text x="120" y="118" text-anchor="middle" fill="#b91c1c" font-weight="600">crash between = </text>
          <text x="120" y="136" text-anchor="middle" fill="#b91c1c" font-weight="600">record LOST</text>
          <text x="120" y="170" text-anchor="middle" fill="#7f1d1d" font-size="11">rare in practice</text>
        </g>
        <g>
          <rect x="250" y="20" width="220" height="170" rx="10" fill="#ECFDF5" stroke="#059669"/>
          <text x="360" y="42" text-anchor="middle" font-weight="700" fill="#065f46" font-family="'IBM Plex Mono',monospace">at-least-once</text>
          <text x="360" y="66" text-anchor="middle" fill="#065f46">1. process record</text>
          <text x="360" y="86" text-anchor="middle" fill="#065f46">2. commit offset</text>
          <text x="360" y="118" text-anchor="middle" fill="#047857" font-weight="600">crash between = </text>
          <text x="360" y="136" text-anchor="middle" fill="#047857" font-weight="600">record REPROCESSED</text>
          <text x="360" y="170" text-anchor="middle" fill="#065f46" font-size="11">the default — make it idempotent</text>
        </g>
        <g>
          <rect x="490" y="20" width="220" height="170" rx="10" fill="#EEF0FF" stroke="#4338CA"/>
          <text x="600" y="42" text-anchor="middle" font-weight="700" fill="#3730a3" font-family="'IBM Plex Mono',monospace">exactly-once</text>
          <text x="600" y="66" text-anchor="middle" fill="#3730a3">process + commit</text>
          <text x="600" y="86" text-anchor="middle" fill="#3730a3">in one transaction</text>
          <text x="600" y="118" text-anchor="middle" fill="#4f46e5" font-weight="600">atomic: both or</text>
          <text x="600" y="136" text-anchor="middle" fill="#4f46e5" font-weight="600">neither</text>
          <text x="600" y="170" text-anchor="middle" fill="#3730a3" font-size="11">Kafka-to-Kafka only (§2.6)</text>
        </g>
      </svg>