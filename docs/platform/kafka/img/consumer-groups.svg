<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'IBM Plex Sans',sans-serif" width="760" height="430">
<rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
      <defs>
        <marker id="ga" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#059669"/></marker>
        <marker id="gb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#4338CA"/></marker>
      </defs>

      <!-- TOPIC -->
      <text x="105" y="80" text-anchor="middle" font-size="12" fill="#0F172A" font-weight="700" font-family="'IBM Plex Mono',monospace">topic: orders</text>
      <rect x="30" y="90" width="150" height="240" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="4 4"/>
      <rect x="42" y="100" width="126" height="40" rx="6" fill="#1e3a8a"/><text x="105" y="125" text-anchor="middle" font-size="12" fill="#bcd0ff" font-family="'IBM Plex Mono',monospace">partition 0</text>
      <rect x="42" y="155" width="126" height="40" rx="6" fill="#1e3a8a"/><text x="105" y="180" text-anchor="middle" font-size="12" fill="#bcd0ff" font-family="'IBM Plex Mono',monospace">partition 1</text>
      <rect x="42" y="210" width="126" height="40" rx="6" fill="#1e3a8a"/><text x="105" y="235" text-anchor="middle" font-size="12" fill="#bcd0ff" font-family="'IBM Plex Mono',monospace">partition 2</text>
      <rect x="42" y="265" width="126" height="40" rx="6" fill="#1e3a8a"/><text x="105" y="290" text-anchor="middle" font-size="12" fill="#bcd0ff" font-family="'IBM Plex Mono',monospace">partition 3</text>

      <!-- GROUP A: fulfilment (2 consumers) -->
      <text x="605" y="36" text-anchor="middle" font-size="12" fill="#059669" font-weight="700" font-family="'IBM Plex Mono',monospace">group: fulfilment</text>
      <rect x="470" y="44" width="270" height="150" rx="10" fill="#ECFDF5" stroke="#059669" stroke-dasharray="4 4"/>
      <rect x="490" y="64" width="230" height="52" rx="8" fill="#fff" stroke="#059669"/>
      <text x="505" y="95" font-size="12.5" fill="#065f46"><tspan font-weight="600">consumer 1</tspan>  ← p0, p1</text>
      <rect x="490" y="128" width="230" height="52" rx="8" fill="#fff" stroke="#059669"/>
      <text x="505" y="159" font-size="12.5" fill="#065f46"><tspan font-weight="600">consumer 2</tspan>  ← p2, p3</text>

      <!-- GROUP B: analytics (4 consumers) -->
      <text x="605" y="224" text-anchor="middle" font-size="12" fill="#4338CA" font-weight="700" font-family="'IBM Plex Mono',monospace">group: analytics</text>
      <rect x="470" y="232" width="270" height="180" rx="10" fill="#EEF0FF" stroke="#4338CA" stroke-dasharray="4 4"/>
      <rect x="490" y="248" width="230" height="34" rx="7" fill="#fff" stroke="#4338CA"/>
      <text x="505" y="270" font-size="11.5" fill="#3730a3"><tspan font-weight="600">consumer 1</tspan> ← p0</text>
      <rect x="490" y="288" width="230" height="34" rx="7" fill="#fff" stroke="#4338CA"/>
      <text x="505" y="310" font-size="11.5" fill="#3730a3"><tspan font-weight="600">consumer 2</tspan> ← p1</text>
      <rect x="490" y="328" width="230" height="34" rx="7" fill="#fff" stroke="#4338CA"/>
      <text x="505" y="350" font-size="11.5" fill="#3730a3"><tspan font-weight="600">consumer 3</tspan> ← p2</text>
      <rect x="490" y="368" width="230" height="34" rx="7" fill="#fff" stroke="#4338CA"/>
      <text x="505" y="390" font-size="11.5" fill="#3730a3"><tspan font-weight="600">consumer 4</tspan> ← p3</text>

      <!-- GROUP A assignment lines (green) -->
      <g stroke="#059669" stroke-width="1.5" opacity="0.6">
        <line x1="168" y1="120" x2="486" y2="90"  marker-end="url(#ga)"/>
        <line x1="168" y1="175" x2="486" y2="90"  marker-end="url(#ga)"/>
        <line x1="168" y1="230" x2="486" y2="154" marker-end="url(#ga)"/>
        <line x1="168" y1="285" x2="486" y2="154" marker-end="url(#ga)"/>
      </g>
      <!-- GROUP B assignment lines (indigo) -->
      <g stroke="#4338CA" stroke-width="1.5" opacity="0.55">
        <line x1="168" y1="120" x2="486" y2="265" marker-end="url(#gb)"/>
        <line x1="168" y1="175" x2="486" y2="305" marker-end="url(#gb)"/>
        <line x1="168" y1="230" x2="486" y2="345" marker-end="url(#gb)"/>
        <line x1="168" y1="285" x2="486" y2="385" marker-end="url(#gb)"/>
      </g>
    </svg>