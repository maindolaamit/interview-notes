<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
    <marker id="arg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
  </defs>

  <text x="20" y="28" font-size="15" font-weight="bold" fill="#111827">Push: CI deploys to the cluster</text>
  <rect x="20" y="45" width="130" height="50" rx="6" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="85" y="75" text-anchor="middle" fill="#1e1b4b">App repo</text>
  <rect x="230" y="45" width="170" height="50" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="315" y="66" text-anchor="middle" fill="#78350f">CI pipeline</text>
  <text x="315" y="84" text-anchor="middle" font-size="11" fill="#92400e">holds cluster credentials</text>
  <rect x="490" y="45" width="230" height="50" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="605" y="75" text-anchor="middle" fill="#064e3b">Kubernetes cluster</text>
  <line x1="150" y1="70" x2="228" y2="70" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="189" y="62" text-anchor="middle" font-size="11" fill="#374151">commit</text>
  <line x1="400" y1="70" x2="488" y2="70" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="444" y="62" text-anchor="middle" font-size="11" fill="#374151">kubectl apply</text>
  <text x="605" y="118" text-anchor="middle" font-size="11" fill="#b91c1c">manual edits drift unnoticed</text>

  <line x1="20" y1="145" x2="740" y2="145" stroke="#e5e7eb" stroke-width="1"/>

  <text x="20" y="175" font-size="15" font-weight="bold" fill="#111827">Pull (GitOps): the cluster syncs itself from Git</text>
  <rect x="20" y="195" width="130" height="50" rx="6" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="85" y="225" text-anchor="middle" fill="#1e1b4b">App repo</text>
  <rect x="230" y="195" width="170" height="50" rx="6" fill="#fef3c7" stroke="#d97706"/>
  <text x="315" y="216" text-anchor="middle" fill="#78350f">CI pipeline</text>
  <text x="315" y="234" text-anchor="middle" font-size="11" fill="#92400e">build, push image, bump tag</text>
  <rect x="230" y="270" width="170" height="45" rx="6" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="315" y="290" text-anchor="middle" fill="#1e1b4b">Config repo</text>
  <text x="315" y="306" text-anchor="middle" font-size="11" fill="#3730a3">desired state</text>
  <rect x="490" y="195" width="230" height="120" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="605" y="217" text-anchor="middle" fill="#064e3b">Kubernetes cluster</text>
  <rect x="520" y="232" width="170" height="40" rx="6" fill="#ffffff" stroke="#059669"/>
  <text x="605" y="257" text-anchor="middle" fill="#064e3b">Argo CD / Flux agent</text>
  <text x="605" y="295" text-anchor="middle" font-size="11" fill="#047857">reconciles, reverts drift</text>
  <line x1="150" y1="220" x2="228" y2="220" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="189" y="212" text-anchor="middle" font-size="11" fill="#374151">commit</text>
  <line x1="315" y1="245" x2="315" y2="268" stroke="#374151" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="518" y1="258" x2="402" y2="290" stroke="#059669" stroke-width="1.8" marker-end="url(#arg)"/>
  <text x="440" y="258" text-anchor="middle" font-size="11" fill="#047857">watch / pull</text>
</svg>
