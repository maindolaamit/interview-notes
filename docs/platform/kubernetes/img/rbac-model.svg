<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'IBM Plex Sans',Helvetica,Arial,sans-serif" font-size="13">
  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <g font-weight="bold" fill="#0f172a" text-anchor="middle">
    <text x="90" y="28">Subjects (who)</text>
    <text x="290" y="28">Bindings (link)</text>
    <text x="490" y="28">Roles (what)</text>
    <text x="680" y="28">Resources</text>
  </g>
  <g>
    <rect x="20" y="50" width="140" height="40" rx="6" fill="#dbeafe" stroke="#1e3a8a"/>
    <text x="90" y="75" text-anchor="middle" fill="#1e3a8a">User</text>
    <rect x="20" y="110" width="140" height="40" rx="6" fill="#dbeafe" stroke="#1e3a8a"/>
    <text x="90" y="135" text-anchor="middle" fill="#1e3a8a">Group</text>
    <rect x="20" y="170" width="140" height="40" rx="6" fill="#dbeafe" stroke="#1e3a8a"/>
    <text x="90" y="195" text-anchor="middle" fill="#1e3a8a">ServiceAccount</text>
  </g>
  <g>
    <rect x="215" y="70" width="150" height="50" rx="6" fill="#dcfce7" stroke="#166534"/>
    <text x="290" y="92" text-anchor="middle" fill="#166534">RoleBinding</text>
    <text x="290" y="110" text-anchor="middle" fill="#166534" font-size="11">one namespace</text>
    <rect x="215" y="160" width="150" height="50" rx="6" fill="#dcfce7" stroke="#166534"/>
    <text x="290" y="182" text-anchor="middle" fill="#166534">ClusterRoleBinding</text>
    <text x="290" y="200" text-anchor="middle" fill="#166534" font-size="11">whole cluster</text>
  </g>
  <g>
    <rect x="415" y="70" width="150" height="50" rx="6" fill="#fef3c7" stroke="#b45309"/>
    <text x="490" y="92" text-anchor="middle" fill="#92400e">Role</text>
    <text x="490" y="110" text-anchor="middle" fill="#92400e" font-size="11">namespaced rules</text>
    <rect x="415" y="160" width="150" height="50" rx="6" fill="#fef3c7" stroke="#b45309"/>
    <text x="490" y="182" text-anchor="middle" fill="#92400e">ClusterRole</text>
    <text x="490" y="200" text-anchor="middle" fill="#92400e" font-size="11">cluster-wide rules</text>
  </g>
  <g>
    <rect x="615" y="50" width="130" height="34" rx="6" fill="#f1f5f9" stroke="#475569"/>
    <text x="680" y="72" text-anchor="middle" fill="#0f172a">pods, services</text>
    <rect x="615" y="96" width="130" height="34" rx="6" fill="#f1f5f9" stroke="#475569"/>
    <text x="680" y="118" text-anchor="middle" fill="#0f172a">configmaps, secrets</text>
    <rect x="615" y="168" width="130" height="34" rx="6" fill="#f1f5f9" stroke="#475569"/>
    <text x="680" y="190" text-anchor="middle" fill="#0f172a">nodes, namespaces</text>
  </g>
  <g stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <path d="M160 70 L213 90"/>
    <path d="M160 130 L213 100"/>
    <path d="M160 190 L213 110"/>
    <path d="M160 190 L213 185"/>
    <path d="M365 95 L413 95"/>
    <path d="M365 185 L413 185"/>
    <path d="M365 110 L413 175" stroke-dasharray="5,4"/>
    <path d="M565 90 L613 70"/>
    <path d="M565 100 L613 112"/>
    <path d="M565 185 L613 185"/>
  </g>
  <text x="380" y="250" text-anchor="middle" fill="#334155" font-size="12">Dashed: a RoleBinding can reference a ClusterRole, granting its rules in that one namespace only.</text>
  <text x="380" y="272" text-anchor="middle" fill="#334155" font-size="12">RBAC is allow-only: there are no deny rules. No matching binding means "forbidden".</text>
</svg>
